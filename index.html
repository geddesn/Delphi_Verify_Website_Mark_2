<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Trusted evidence for the physical world | Delphi Verify</title>
    <meta
      name="description"
      content="Delphi Verify helps organisations establish the condition, location and state of physical assets at the moments that matter — creating evidence counterparties can independently verify."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Delphi Verify" />
    <meta property="og:title" content="Trusted evidence for the physical world | Delphi Verify" />
    <meta
      property="og:description"
      content="Establish the condition, location and state of physical assets at the moments that matter — with evidence counterparties can independently verify."
    />
    <meta property="og:image" content="https://delphiverify.com/assets/social/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://delphiverify.com/assets/social/og-default.png" />

    <!--
      Applies the stored theme before first paint so a dark-mode visitor never
      sees a white flash. Deliberately inline and synchronous — this must run
      before the stylesheet resolves. Keep it dependency-free.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dv-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* Storage unavailable (private mode, blocked cookies) — fall back to
             the OS preference, which the CSS already handles. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
