<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#090b2d"/>
      <stop offset="100%" stop-color="#030318"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent rule, echoing the eyebrow device used across the site -->
  <rect x="80" y="96" width="56" height="3" fill="#808fe5"/>
  <text x="152" y="107" fill="#808fe5" font-family="IBM Plex Sans, Segoe UI, sans-serif"
        font-size="19" font-weight="700" letter-spacing="2.6">EVIDENCE INFRASTRUCTURE</text>

  <text x="80" y="248" fill="#f7f7f9" font-family="IBM Plex Sans, Segoe UI, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-2.2">Trusted evidence for</text>
  <text x="80" y="338" fill="#f7f7f9" font-family="IBM Plex Sans, Segoe UI, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-2.2">the physical world.</text>

  <!-- Evidence chip: mono, state dot, exactly as the site renders it -->
  <rect x="80" y="404" width="316" height="44" rx="4" fill="#29a058" fill-opacity="0.16"/>
  <circle cx="104" cy="426" r="4" fill="#29a058"/>
  <text x="120" y="432" fill="#29a058" font-family="IBM Plex Mono, monospace"
        font-size="16" letter-spacing="1.2">DELPHI VERIFIED · 4K7M-92QX</text>

  <line x1="80" y1="512" x2="1120" y2="512" stroke="#ffffff" stroke-opacity="0.14"/>

  <image href="data:image/svg+xml;base64," x="80" y="540" width="188" height="53"/>

  <text x="1120" y="574" text-anchor="end" fill="#a8abbb"
        font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="0.4">delphiverify.com</text>
</svg>